name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.1
          find paper-sprite.koplugin spec -name '*.lua' -print0 | xargs -0 luac5.1 -p
          lua5.1 spec/headless.lua
      - name: Check version matches tag
        run: grep -q "version = \"${GITHUB_REF_NAME#v}\"" paper-sprite.koplugin/_meta.lua
      - name: Package
        run: zip -r paper-sprite.koplugin.zip paper-sprite.koplugin -x '*.DS_Store'
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md > changes.md
          cat > notes.md <<NOTES
          阿页的阁楼（ko-paper-sprite）KOReader 插件 / 月读扩展 ${GITHUB_REF_NAME}

          安装：解压 paper-sprite.koplugin.zip，把 paper-sprite.koplugin 目录复制到 KOReader 的 plugins/ 下并重启。
          作为月读扩展：同一个插件即可；月读首页「添加组件」里会出现「阿页」「阿页的阁楼」「阿页的明信片」「纪念物柜」。

          纯离线。代码、文案与美术均为原创（MIT）。
          NOTES
          cat changes.md >> notes.md
          gh release create "$GITHUB_REF_NAME" paper-sprite.koplugin.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
