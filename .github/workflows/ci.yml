name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.1 luajit
      - name: Syntax check (luac -p)
        run: find paper-sprite.koplugin spec -name '*.lua' -print0 | xargs -0 luac5.1 -p
      - name: Headless tests (Lua 5.1)
        run: lua5.1 spec/run.lua
      - name: Headless tests (LuaJIT)
        run: luajit spec/run.lua
